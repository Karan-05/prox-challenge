# fly launch --copy-config && fly secrets set ANTHROPIC_API_KEY=sk-... && fly deploy
app = "omnipro-agent"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
