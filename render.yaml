# One-click deploy on Render: https://render.com/docs/blueprints
services:
  - type: web
    name: omnipro-agent
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard
      - key: CLAUDE_MODEL
        value: claude-opus-5
      - key: MAX_BUDGET_USD_PER_TURN
        value: "0.75"
      - key: AGENT_TIMEOUT_MS
        value: "180000"
      - key: RATE_LIMIT_REQUESTS
        value: "20"
